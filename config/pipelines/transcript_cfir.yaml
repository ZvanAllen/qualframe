id: transcript_cfir_v0_1
description: >
  Transcript-first CFIR pipeline for the AMN workflow.
  Transcripts are coded per CFIR domain, rolled up to parent constructs,
  enriched with surrounding quote context, synthesized at the network level,
  then synthesized across networks.
  Transcripts must be placed in data/raw/transcripts/<network>/ subfolders.
framework: config/frameworks/cfir_v1.yaml
mode: transcript_first
stages:
  - id: transcript_to_cfir
    description: >
      Code each transcript once per CFIR domain (6 passes per transcript).
      Prompt uses {CFIR_DOMAIN} placeholder. Outputs compile into one
      multi-sheet artifact per transcript (one sheet per domain).
    prompt_ref: transcript_to_cfir_domain
    enabled: true
    input_kind: transcript
    output_kind: cfir_coded_domain_table
    review_gate: true
    input_grouping: per_file
    input_source: raw_transcripts
    domain_iterations: true
    use_codebook: true

  - id: participant_parent_construct_rollup
    description: >
      Roll subconstruct rows up into parent constructs per participant.
      Input is the compiled multi-sheet artifact from transcript_to_cfir.
    prompt_ref: participant_parent_construct_rollup
    enabled: true
    input_kind: participant_cfir_workbook
    output_kind: parent_construct_workbook
    review_gate: false
    input_grouping: per_file
    input_source: previous_stage
    use_codebook: true

  - id: quote_context_enrichment
    description: >
      Add two participant sentences before and after each quote per participant.
      Requires the original transcript alongside the rollup output.
    prompt_ref: quote_context_enrichment
    enabled: true
    input_kind: parent_construct_workbook
    output_kind: enriched_construct_workbook
    review_gate: false
    input_grouping: per_file
    input_source: previous_stage
    include_original_transcript: true

  - id: participant_to_network_synthesis
    description: >
      Combine participant rollup outputs grouped by AMN network.
      One LLM call per network; produces one artifact per network.
    prompt_ref: participant_to_network_synthesis
    enabled: true
    input_kind: participant_construct_workbook_bundle
    output_kind: network_synthesis_workbook
    review_gate: true
    input_grouping: bundle_all
    input_source: previous_stage
    group_by_network: true

  - id: cross_network_synthesis
    description: >
      Synthesize across all AMN networks. Runs one domain at a time.
      Input is the network synthesis output.
    prompt_ref: cross_network_synthesis
    enabled: true
    input_kind: network_workbook_bundle
    output_kind: cross_network_domain_table
    review_gate: true
    input_grouping: bundle_all
    input_source: previous_stage
    use_codebook: true
