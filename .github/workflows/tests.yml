name: Offline verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" "setuptools>=69" wheel
      - run: python -m pytest -q
      - run: python scripts/run_workspace_demo.py --no-serve
      - run: python scripts/run_interview_demo.py --run-id ci-cached-demo
      - name: Screen and freeze the source archive
        run: python scripts/package_public_release.py --output artifacts/ci-release.zip
      - name: Prepare dependency wheels
        run: python -m pip wheel --wheel-dir artifacts/ci-wheelhouse .
      - name: Verify isolated installation and local restart without network access
        run: python scripts/release_preflight.py --archive artifacts/ci-release.zip --wheelhouse artifacts/ci-wheelhouse --work-dir artifacts/ci-install
