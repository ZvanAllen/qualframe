[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qualframe"
version = "0.1.0"
description = "Framework-aware workflow engine for AI-assisted qualitative analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Zack van Allen" }
]
dependencies = [
  "openpyxl>=3.1",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "python-docx>=1.1"
]

[project.optional-dependencies]
llm = [
  "anthropic>=0.34.0",
  "openai>=1.40.0",
  "google-generativeai>=0.8.0"
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11"
]

[project.scripts]
qualframe = "qualframe.cli:app"
qualframe-eval = "qualframe_eval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qualframe = ["static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
