  artifacts: artifacts
  review_queue: review_queue
  exports: exports
  logs: logs

provider:
  name: google
  model: gemini-2.5-pro
  api_key_env: GOOGLE_API_KEY
  temperature: 0.0
  max_tokens: 32000

 
